<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeFlow NG — Discovery Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <header class="app-header"><div class="header-brand"><h1>TradeFlow Discovery</h1><p>Internal operator workspace · Tomatoes · Dikko/Niger</p></div><button id="btn-new-candidate" class="btn btn-primary">+ Add Potential Participant</button></header>
    <nav class="app-nav" aria-label="Main navigation">
      <button class="nav-tab active" data-tab="tab-dashboard">Home</button>
      <button class="nav-tab" data-tab="tab-registry">Participants</button>
      <button class="nav-tab" data-tab="tab-followups">Follow-ups</button>
      <button class="nav-tab" data-tab="tab-journal">Interviews / Evidence</button>
      <button class="nav-tab" data-tab="tab-intelligence">Discovery Insights</button>
    </nav>
    <details class="secondary-navigation"><summary>More tools &amp; data management</summary><nav aria-label="Supporting tools">
      <button class="nav-tab" data-tab="tab-cases">Transaction cases</button><button class="nav-tab" data-tab="tab-jobs">Upcoming sales / purchases</button><button class="nav-tab" data-tab="tab-decisions">Stage decisions</button><button class="nav-tab" data-tab="tab-brief">Daily brief</button><button id="btn-export-backup" class="btn btn-ghost">Backup / Export</button><button id="btn-settings-danger" class="btn btn-ghost">Data management</button>
    </nav></details>
    <div id="app-feedback" role="status" aria-live="polite"></div>
    <!-- Content Sections -->
    <main class="app-content"><section id="tab-followups" class="tab-pane"></section>
      <section id="tab-dashboard" class="tab-pane active">
        <!-- Rendered by dashboard.js -->
      </section>

      <section id="tab-registry" class="tab-pane">
        <!-- Rendered by participantTable.js -->
      </section>

      <section id="tab-cases" class="tab-pane">
        <!-- Rendered by caseTable.js -->
      </section>

      <section id="tab-jobs" class="tab-pane">
        <!-- Rendered by jobTable.js -->
      </section>

      <section id="tab-decisions" class="tab-pane">
        <!-- Rendered by decisionTable.js -->
      </section>

      <section id="tab-journal" class="tab-pane">
        <!-- Rendered by journalView.js -->
      </section>

      <section id="tab-intelligence" class="tab-pane">
        <!-- Rendered by discoveryIntelligence.js -->
      </section>

      <section id="tab-brief" class="tab-pane">
        <!-- Rendered by dailyBriefView.js -->
      </section>
    </main>

    <!-- Modal Container for Intake Forms -->
    <div id="modal-container" class="modal-overlay hidden">
      <!-- Rendered dynamically -->
    </div>

    <!-- Slide-over Drawer for Participant Detail & Journal Logging -->
    <div id="drawer-container" class="drawer-overlay hidden">
      <!-- Rendered dynamically -->
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
