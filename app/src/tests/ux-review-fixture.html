<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Synthetic interview review test</title><link rel="stylesheet" href="../style.css"></head><body><div id="app"><main class="app-content"><h1>Synthetic UI test only</h1><p>No real interview, upload or customer evidence is used.</p><button id="open" class="btn btn-primary">Open synthetic AI draft</button><p id="result" role="status"></p></main><div id="app-feedback"></div><div id="modal-container" class="modal-overlay hidden"></div></div><script type="module">
import {renderAiReviewModal} from '../ui/aiReviewModal.js';
import {installUX} from '../ui/ux.js';
installUX();document.getElementById('open').onclick=()=>renderAiReviewModal({transcription:{provider_name:'Synthetic fixture',model_version:'ui-test',operator_selected_language:'AUTO_DETECT',provider_detected_language:'en-NG',original_transcript:'Synthetic example: I buy tomatoes for a shop.',english_translation:'Synthetic example: I buy tomatoes for a shop.'},ai_draft_analysis:{explicit_claims:[{claim:'Buys tomatoes for a shop',verbatim_quote:'I buy tomatoes for a shop.',evidence_status:'REPORTED'}],explicit_problems:[],suggested_followups:[]}}, {full_name:'Practice participant',participant_ref:'TF-CD01-P999'},entry=>{document.getElementById('result').textContent='Human-reviewed evidence saved in test callback only. Claim status: '+entry.ai_provenance.human_review.approved_claims[0]?.evidence_status;},()=>{document.getElementById('result').textContent='Draft rejected. Nothing saved.';});
</script></body></html>
